[[mgr.prepend_keymap]]
on = "<C-p>"
run = "shell -- qlmanage -p %s"
desc = "Quick Look"

[[mgr.prepend_keymap]]
on = ["g", "F"]
run = "shell -- open -R %h"
desc = "Reveal in Finder"

[[mgr.prepend_keymap]]
on = ["g", "o"]
run = "shell -- open %s"
desc = "Open with the macOS default app"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd ~/Projects"
desc = "Go to Projects"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Documents"
desc = "Go to Documents"

[[mgr.prepend_keymap]]
on = ["g", "v"]
run = 'shell -- [ -n "$OBSIDIAN_VAULT" ] && ya emit cd "$OBSIDIAN_VAULT"'
desc = "Go to Obsidian vault"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to Git repository root"

[[mgr.prepend_keymap]]
on = "!"
for = "unix"
run = 'shell "$SHELL" --block'
desc = "Open shell here"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "q"
run = "plugin confirm-quit"
desc = "Quit Yazi, confirming if multiple tabs are open"

[[mgr.prepend_keymap]]
on = "Q"
run = "noop"
desc = "Disable quitting with Q"

[[mgr.prepend_keymap]]
on = "<C-z>"
run = "noop"
desc = "Prevent accidental suspension"

[[mgr.prepend_keymap]]
on = "f"
run = "plugin jump-to-char"
desc = "Jump to a file by its first character"

[[mgr.prepend_keymap]]
on = "F"
run = "filter --smart"
desc = "Filter files"

[[mgr.prepend_keymap]]
on = "T"
run = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

[[mgr.prepend_keymap]]
on = "<C-t>"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[input.prepend_keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel input"
